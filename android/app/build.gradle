apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.krishiaadhar"

    defaultConfig {
        applicationId "com.krishiaadhar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "2.2"

        // ✅ Support both 32-bit and 64-bit
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release

            // 🚫 Disable these temporarily for high-end debugging
            minifyEnabled false
            shrinkResources false

            // ✅ Uncomment if you want ProGuard in production
            // minifyEnabled enableProguardInReleaseBuilds
            // shrinkResources true

            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // ✅ Optional: only if you have C++ native modules
    externalNativeBuild {
        cmake {
            version "3.22.1"
            // arguments "-DANDROID_STL=c++_shared", "-DANDROID_TOOLCHAIN=clang"
            // cppFlags "-std=c++20 -frtti -fexceptions"
        }
    }
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

dependencies {
    implementation("com.facebook.react:react-android")
       implementation platform('com.google.firebase:firebase-bom:32.2.3')
    implementation 'com.google.firebase:firebase-messaging'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Optional: Print current NDK path
task printNdkVersion {
    doLast {
        println "NDK Path: ${android.ndkDirectory}"
    }
}
